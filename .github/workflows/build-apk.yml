name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
                     "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache native build (llama.cpp)
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}-v3
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK info
        run: |
          ls -la app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release v0.1.0
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create v0.1.0 --repo "$GITHUB_REPOSITORY" \
              --title "LFM3 Omni Local v0.1.0" \
              --notes-file RELEASE_NOTES.md
          gh release upload v0.1.0 app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
